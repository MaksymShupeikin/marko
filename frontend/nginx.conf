server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # main.dart.js is 3.4 MB and canvaskit.wasm 7.2 MB uncompressed; both
    # shrink by ~4x over the wire.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    # Every asset revalidates on every load, so a deploy is picked up
    # immediately — but an unchanged build answers 304 instead of resending
    # eleven megabytes. Filenames aren't content-hashed, so the ETag is what
    # keeps this honest; it must stay on.
    etag on;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|mjs|wasm|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
