[project]
name = "marko-backend"
version = "0.1.0"
description = "FastAPI backend and prom.ua competitive pricing engine for Marko."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "celery[redis]>=5.4",
    "cryptography>=49.0",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "pyjwt[crypto]>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "requests>=2.31",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
marko = "marko.cli:main"
prom-scraper = "marko.cli:main"
validate-response-footer = "marko.governance.response_footer_cli:main"
validate-machine-summary = "marko.governance.machine_summary_cli:main"
validate-scraper-audit = "marko.governance.scraper_audit_summary_cli:main"
catalog-candidate-report = "marko.catalog_candidate_report_cli:main"
catalog-coverage-measurement = "marko.catalog_coverage_measurement_cli:main"
brand-review-worksheet = "marko.brand_review_worksheet_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marko", "src/metis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: opt-in tests requiring a real PostgreSQL database",
]
