[project]
name = "marko-backend"
version = "0.1.0"
description = "FastAPI backend and prom.ua competitive pricing engine for Marko."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "openai>=2.0",
    "asyncpg>=0.30",
    "celery[redis]>=5.4",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "pydantic-settings>=2.7",
    "requests>=2.31",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
]

[project.scripts]
marko = "marko.cli:main"
prom-scraper = "marko.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marko"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
