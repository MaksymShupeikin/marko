# Граф номеров товара (WP-3): какие связи создаются, с каким статусом и как
# выбирается канонический номер.
#
# Граф — звезда, а не клика: рёбра идут от канонического номера товара к каждому
# другому его номеру. Транзитивность (A↔B, B↔C ⇒ A↔C) в этом пакете не
# вводится сознательно — она многократно повышает риск слить две разные детали.
#
# Связь из этих источников НИКОГДА не получает REJECTED: отсутствие данных не
# есть опровержение. Максимум — REVIEW, и тогда на цену она не влияет.

schema_version: metis-identity-graph-v1
method_version: identity-graph-v6

# Источники по убыванию доверия. Порядок не декоративный: он решает, чей номер
# станет каноническим, и он же задаёт статус связи.
#
#   OWN_EXPORT_CHARACTERISTIC — блок характеристик собственного экспорта.
#       Номер написан самим продавцом про свой товар.
#   KEMP_REFERENCE_MAP — справочник заказчика. Проверен на контрольной
#       выборке 2026-07-29: 161 из 162 позиций подтвердились.
#   KEMP_SITE — карточка kemp.ua. Подписи полей недостоверны (NO_9), контрольной
#       проверки нет, поэтому связь рождается REVIEW и человеком или совпадением
#       с другим источником повышается до CONFIRMED — но не сама собой.
#
# asserts_oe разделяет два разных вида утверждения, и от этого зависит, что
# считать конфликтом. Справочник и карточка отвечают на вопрос «какой OE у
# ЭТОЙ детали» — если они отвечают по-разному, это спор. Блок характеристик
# собственного экспорта — просто список кроссов; то, что в нём нет какого-то
# номера, не есть возражение против него. Отсутствие данных не есть
# опровержение, и путать эти два случая нельзя: иначе почти каждая позиция
# получила бы аномалию, потому что справочник как раз и нужен там, где
# продавец OE не написал.
# publisher и vintage разделяют два справочника заказчика. Решение заказчика от
# 2026-07-30: «первый файл годовалый, второй вчерашний». Известен только порядок
# доставки, поэтому vintage — порядковый номер, а не дата: выдумывать точную дату
# из его слов нельзя. Третий файл станет vintage: 3.
#
# Внутри одного publisher расхождение — это не спор, а замена номера за год.
# Спором остаётся только расхождение между разными publisher: справочник против
# карточки сайта. Это и есть то правило разрешения, которого до его ответа не
# существовало, и из-за отсутствия которого 158 позиций стояли неразрешимыми.
sources:
  - name: OWN_EXPORT_CHARACTERISTIC
    status: CONFIRMED
    asserts_oe: false
    publisher: kemp_own_export
    vintage: 1
  # Колонка «Код товару» собственного экспорта. Замерено на живой базе 31.07:
  # у 554 строк из 4647 там внутренний код 776*, у остальных 4093 — настоящий
  # номер детали (056121113D, 93818439). Это разные вещи в одной колонке, и
  # разбираются они по форме номера, а не по названию колонки.
  #
  # Источник обязателен: без него номер, по которому ворота ищут позицию, не
  # попадает в граф вообще, и связи соединяют кроссы между собой в стороне от
  # него. Для 88% каталога это была бы вся польза пакета.
  #
  # asserts_oe: false — потому что колонка называется «код товара», а не «OE», и
  # мы уже знаем, что в ней лежит и то и другое. Номер принадлежит этой детали;
  # что он именно оригинальный, колонка не утверждает.
  - name: OWN_EXPORT_CODE
    status: CONFIRMED
    asserts_oe: false
    publisher: kemp_own_export_code
    vintage: 1
  - name: KEMP_REFERENCE_MAP_V2
    status: CONFIRMED
    asserts_oe: true
    publisher: kemp_reference_book
    vintage: 2
  - name: KEMP_REFERENCE_MAP_V1
    status: CONFIRMED
    asserts_oe: true
    publisher: kemp_reference_book
    vintage: 1
  # Колонка артикула того же справочника — но это другое утверждение, и потому
  # отдельный источник, а не тот же самый. Справочник отвечает «какой OE у этой
  # детали»; артикул поставщика (Boge 27C06F, Elring 863.130) — это КРОСС: он
  # обозначает ту же деталь, но OE не является и с OE не спорит.
  #
  # Если подать его под тем же именем, что и OE, то позиция, у которой в
  # справочнике только артикул Sachs, начнёт «противоречить» OE с карточки
  # сайта — и получит ложную аномалию. asserts_oe: false ровно про это.
  #
  # Свой publisher, потому что vintage — порядок доставки файла, и приписывать
  # этому голосу чужой порядковый номер значило бы выдумывать историю поставок.
  - name: KEMP_REFERENCE_ARTICLE
    status: CONFIRMED
    asserts_oe: false
    publisher: kemp_reference_article
    vintage: 1
  # Explicit «Оригинальные номера» / «Оригінальні номери» / OE/OEM field from
  # an exact customer-owned Prom product card.  This is a different assertion
  # from the generic seller code block: the card owner labels the value as the
  # vehicle manufacturer's number and the ingestion path retains the exact
  # product URL, product id, label, parser version and response/file hash.
  # It remains owner-asserted REVIEW evidence until an operator accepts the
  # bound pair (or an independent confirming source agrees); unbound text never
  # enters this source.
  - name: OWN_STORE_LABELLED_OE
    status: REVIEW
    asserts_oe: true
    publisher: kemp_owned_store
    vintage: 1
  # Avto.pro is the customer's seller, but its part-card labels have not yet
  # passed the export/independent-validation gate.  Keep its exact card OE
  # section as review evidence so it can close gaps without auto-admission.
  - name: AVTOPRO_CARD_OE
    status: REVIEW
    asserts_oe: true
    publisher: avtopro_optkiev
    vintage: 1
  - name: AVTOPRO_CARD_CROSS
    status: REVIEW
    asserts_oe: false
    publisher: avtopro_optkiev_cross
    vintage: 1
  # spareto.com — независимый европейский каталог, не наш и не заказчика.
  # Страница /oe/<номер> отвечает на вопрос «какая деталь носит этот номер»
  # заголовком «<номер> - <тип детали> OE number by<МАРКИ>». Утверждение именно
  # про оригинальность, поэтому asserts_oe: true.
  #
  # Статус REVIEW, а не CONFIRMED, по двум причинам. Первая: контрольной
  # выборки на 4646 позиций, как у справочника, здесь нет — проверено 50 строк
  # (25 верных номеров и 25 подставных), 45 вердиктов, 45 верных. Хорошо, но
  # это 50, а не 4646. Вторая: вердикт считает наш разбор заголовка
  # (`oe_number_verdict.py`), а не сам каталог, и ошибка разбора неотличима от
  # ошибки каталога.
  #
  # Эха тут нет: номера мы взяли у себя, но подтверждение — тип детали и список
  # марок — целиком с их страницы, наших данных spareto не видел.
  - name: SPARETO_OE_PAGE
    status: REVIEW
    asserts_oe: true
    publisher: spareto
    vintage: 1
  - name: KEMP_SITE
    status: REVIEW
    asserts_oe: true
    publisher: kemp_site
    vintage: 1

# Какой файл каким источником является. Ключ — sha256 сырых байт, потому что имя
# файла ничего не гарантирует, а хэш гарантирует. Незнакомый хэш загрузчик
# отвергает: неизвестный справочник не должен молча получить доверие known-файла.
datasets:
  - sha256: 54687209e28a4fc30b42daefdc196b3222ac1dc16dfd705d9807dac52537bbd7
    source: KEMP_REFERENCE_MAP_V1
    note: "kemp_reference_map.csv, 4646 строк, годовалый по словам заказчика"
  - sha256: cb2b3c667f9efd8fa50e6d600e7076914e867c31e95bf7f6a8955ee24565793a
    source: KEMP_REFERENCE_MAP_V2
    note: "kemp_oe_map.csv, 7743 строки, получен 2026-07-29"
  - sha256: b175ca578ebeb9953cb2d07ae7076331965081d69ebdbe53f437b13f9ebaaaaa
    source: OWN_STORE_LABELLED_OE
    note: "prom_stores_numbers_catalog.csv, exact owner-card OE blocks, 2026-08-08"
  - sha256: fae4770e0d0b6ff70df32a9382608d11153612f2d0b23e9c3d3c2e1e659c4313
    source: OWN_STORE_LABELLED_OE
    note: "prom_stores_numbers_catalog.xlsx, exact owner-card OE blocks, 2026-08-08"
  - sha256: 57872bcaae16e9b6ac2c82d01f883196b3ab44f5eb9fdbcdb1cfeb8ee12f2e43
    source: SPARETO_OE_PAGE
    note: "spareto_oe_confirmations.csv, 470 подтверждений со страниц /oe/, 2026-08-09"

# Выбор канонического номера, когда их несколько (обычный случай: 056121113D и
# 050121113C у одного товара).
#
# ВАЖНО, ЧЕГО ЗДЕСЬ НЕТ. Нет правила «длинный номер конкретнее» и никакого
# другого смыслового предпочтения между OE одного источника. Между двумя
# настоящими OE одной детали содержательного победителя не существует —
# автопроизводитель сам выпускал деталь под обоими номерами. Поэтому ничья
# разрешается устойчивым произвольным правилом, а не притворством, что мы
# судим по существу.
#
# На результат поиска выбор всё равно не влияет: WP-4 опрашивает ВСЕ номера
# графа, а канонический — лишь якорь связи и то, что показывается человеку.
canonical:
  # Предпочтение источника ДЛЯ ЯКОРЯ — это не порядок sources выше. Тот
  # отвечает на вопрос «насколько надёжно утверждение» и решает статус связи;
  # этот — на вопрос «какой номер лучше опознаёт деталь», и здесь выигрывает
  # OE. Справочник ставится первым потому, что он проверен на контрольной
  # выборке. Блок характеристик собственного экспорта надёжен как утверждение,
  # но это список кроссов, и в нём запросто лежит номер поставщика, а не OE —
  # якорем такой номер быть не должен.
  source_preference:
    - KEMP_REFERENCE_MAP_V2
    - KEMP_REFERENCE_MAP_V1
    # Раньше кроссов: номер в колонке кода товара — это то, чем позиция названа
    # в собственном каталоге, а список кроссов — то, чем её называют другие.
    - OWN_EXPORT_CODE
    - OWN_EXPORT_CHARACTERISTIC
    - KEMP_REFERENCE_ARTICLE
    - OWN_STORE_LABELLED_OE
    - AVTOPRO_CARD_OE
    - AVTOPRO_CARD_CROSS
    - SPARETO_OE_PAGE
    - KEMP_SITE
  # Применяются по порядку, до первого различающего.
  rules:
    - SOURCE_PREFERENCE  # по порядку source_preference выше
    - LEXICOGRAPHIC      # полный порядок: результат воспроизводим всегда

# Аномалии. Позиция с аномалией попадает в список ручного разбора и не
# перестаёт существовать: сливать или отбрасывать запрещено.
#
#   OE_SOURCE_CONFLICT — сайт и справочник дают разные OE для одного товара.
#       Обе связи остаются, каноническим выбирается номер справочника (он
#       проверен на контрольной выборке, сайт — нет). Молча выбрать один и
#       потерять второй запрещено: это может быть замена номера, и тогда верен
#       как раз второй. На замере 2026-07-29 таких позиций 174.
#   SHARED_ARTICLE_FANOUT — один артикул после нормализации принадлежит двум-
#       четырём разным внутренним кодам (151 случай в справочнике 28.07).
#       Автоматически сливать запрещено — прямой путь к сравнению цены с чужой
#       деталью (M9).
#   OE_SUPERSEDED_BY_NEWER_REFERENCE — номер пришёл из старой версии справочника,
#       а новая версия того же справочника называет для этой позиции другой.
#       Свежая версия получает CONFIRMED и становится якорем; старый номер не
#       выбрасывается — за год номер могли заменить, и старый остаётся настоящим
#       номером детали, по которому у конкурента может лежать предложение. Но
#       цену он не двигает, пока человек не подтвердит.
#   SOURCE_SEMANTIC_CONFLICT — две строки одной ревизии или две ревизии,
#       склеенные одним внутренним
#       кодом, явно расходятся по физическому признаку (например,
#       left/right или front/rear). Свежесть файла не доказывает, что это
#       та же деталь, поэтом все рёбра такого ключа остаются REVIEW.
#   PUBLIC_NUMBER_SEMANTIC_FANOUT — один публичный номер приписан двум
#       структурно разным товарам. Это работает и без ребра: поиск по
#       одному canonical всё равно смешал бы эти детали.
anomalies:
  - name: OE_SOURCE_CONFLICT
    review_required: true
  - name: SHARED_ARTICLE_FANOUT
    review_required: true
  - name: OE_SUPERSEDED_BY_NEWER_REFERENCE
    review_required: true
  - name: SOURCE_SEMANTIC_CONFLICT
    review_required: true
  - name: PUBLIC_NUMBER_SEMANTIC_FANOUT
    review_required: true
