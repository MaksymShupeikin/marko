schema_version: metis-raise-policy-v2
method_version: raise-policy-v2

# Какую точку рынка занимаем. Меняется заказчиком, не инженером.
#   aggressive — быть дешевле большинства, брать оборотом
#   balanced   — встать в середину рынка своего уровня
#   premium    — верхняя часть диапазона
#   budget_floor — быть на 2–5% дешевле самого дешёвого сопоставимого оффера
#
# Решение заказчика от 2026-07-30:
# - сегмент бюджетный;
# - уровни брендов, закупка и возраст остатка цену не определяют;
# - повышение и снижение считаются от минимума сопоставимых конкурентов;
# - если доступны только оригиналы, берётся самый дешёвый оригинал.
active_strategy: budget_floor

strategies:
  aggressive:
    target_quantile: "0.25"
  balanced:
    target_quantile: "0.50"
  premium:
    target_quantile: "0.75"
  budget_floor:
    target_quantile: "0"
    # Шаг 1 UAH нужен, чтобы округление не выводило дешёвые позиции за
    # утверждённый коридор 2–5%. Legacy-стратегии сохраняют шаг 10 UAH.
    psychological_step: "1"
    minimum_discount: "0.02"
    maximum_discount: "0.05"
    # Опциональная доля нашей цены, ниже которой предложение не допускается к
    # выбору цели, но остаётся видимым доказательством. Механизм нужен для
    # числовых коллизий и цен-заглушек («цена по запросу»).
    #
    # На 292 позициях измерен кандидат 0.35: сырой минимум даёт 193 понижения,
    # из них 109 глубже -50%; кандидат даёт 167 понижений, 55 глубоких и на 19
    # поднятий больше. Это измерение, а не решение владельца.
    #
    # C-10/G-6 запрещает агенту назначать ценовой порог. Поэтому в поставляемой
    # политике он выключен: заказчик утвердил именно самый дешёвый валидный
    # сопоставимый оффер. Для активации измеренного кандидата 0.35 необходимо
    # отдельное решение владельца.
    target_floor_ratio: "0"
    # Один продавец воспроизводит буквальный минимум, как потребовал заказчик.
    # Значение >1 доступно как отдельная защита, но меняло бы цель на второй или
    # последующий оффер и потому требует отдельного решения владельца.
    floor_corroboration_sellers: 1
    tier_agnostic: true
    allow_lower: true
    ignore_stock_status: true
    ignore_cost_floor: true
    owner_decision_reference: customer-reply-2026-07-30

guards:
  # Меньше трёх приведённых цен — не база, а совпадение.
  min_evidence: 3
  # Legacy-стратегии: не дёргать заказчика ради +2%.
  min_change_pct: "0.03"
  # Legacy-стратегии: ограничить один шаг четвертью текущей цены.
  max_step_pct: "0.25"
  # Округление всегда вниз, чтобы предложение не перескочило целевую точку.
  psychological_step: "10"

confidence:
  # Сравнение строгое (<), а не нестрогое: когорта ровно на границе лучшую
  # оценку не получает. Проверенный пример: n=4, robust_CV=0.1516 → MEDIUM.
  high_min_evidence: 4
  high_max_robust_cv: "0.15"
  medium_min_evidence: 3
  medium_max_robust_cv: "0.35"
