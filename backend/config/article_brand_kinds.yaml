# Вид бренда в колонке «фирма по артикулу» справочника KEMP (WP-2, пункт 3).
#
# Зачем: артикул сам по себе не говорит, OE это или номер поставщика.
# Говорит бренд рядом с ним. Номер бренда-автопроизводителя — OE; номер
# бренда-поставщика — MPN, и подставлять его вместо OE запрещено (NO_5):
# именно эта подстановка породила исходную проблему каталога.
#
# Покрытие обязано быть полным: в справочнике 101 различное значение
# колонки, и все 101 перечислены здесь поимённо. Незнакомое значение при
# обновлении справочника не угадывается — оно даёт UNKNOWN и закрывает
# позицию в MPN_ONLY (fail-closed). Пустое значение колонки в этот файл не
# входит: его обрабатывает загрузчик, см. NO_BRAND.
#
# rows: — число строк справочника с этим брендом на sha256
# 54687209e28a4fc30b42daefdc196b3222ac1dc16dfd705d9807dac52537bbd7.
# Это документация замера, а не проверяемый контракт: справочник обновится,
# и числа разойдутся, что само по себе не ошибка.

schema_version: metis-article-brand-kinds-v1
method_version: article-brand-kinds-v1
reference_map_sha256: 54687209e28a4fc30b42daefdc196b3222ac1dc16dfd705d9807dac52537bbd7

