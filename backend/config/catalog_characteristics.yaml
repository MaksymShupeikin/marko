schema_version: marko-catalog-characteristics-v1
method_version: catalog-characteristics-v1

# Prom экспортирует характеристики товара повторяющимися тройками колонок
# "Назва_Характеристики / Одиниця_виміру_Характеристики / Значення_Характеристики".
# Троек в наблюдённом экспорте 12, но их число не фиксировано, поэтому колонки
# определяются по префиксу заголовка, а не по индексу.
#
# Замер 2026-07-28 на экспорте 4901 × 87 (docs/METIS_IDENTITY_WP0_MEASUREMENT):
#   Код запчастини        4677 товаров  — список номеров через запятую
#   Сумісність з маркою   4664 товаров  — марки через "|"
#   Сумісність з моделлю  4222 товаров  — модели через "|"
#   Кросс-номери           252 товара   — дополнительные явные кроссы
# Вместе это даёт 5060 номеров сверх Код_товару у 4111 товаров из 4901.

column_headers:
  name_prefixes:
    - "назва характеристики"
    - "название характеристики"
  value_prefixes:
    - "значення характеристики"
    - "значение характеристики"

# Пороги формы номера намеренно мягче, чем `extraction` в crosses.yaml
# (alphanumeric_min_length 6, numeric_min_length 7). Те пороги защищают от
# ложных срабатываний при добыче номеров из свободного текста чужих описаний,
# где цена ошибки высока. Здесь источник другой: номер объявлен продавцом в
# отдельном поле, догадываться не о чем. Применение порогов crosses.yaml
# отбросило бы 297 настоящих номеров длиной 4-5 символов (например "77643"),
# измерено на том же экспорте. Наблюдённый диапазон длин — 4..20 символов
# после нормализации; за его пределами оказались ровно два токена ("0", "944"),
# и оба являются мусором.
limits:
  min_number_length: 4
  max_number_length: 20
  max_part_numbers: 64
  max_applicability_values: 64
  max_value_length: 255

characteristics:
  - field: part_numbers
    names:
      - "код запчастини"
      - "код запчасти"
      - "кросс-номери"
      - "кросс-номера"
      - "крос-номери"
      - "cross numbers"
    separators: [",", ";"]

  - field: applicability_brand
    names:
      - "сумісність з маркою"
      - "совместимость с маркой"
      - "марка"
      - "марка автомобиля"
      - "марка автомобіля"
    # Разделитель только "|". Запятая встречается в одном значении на весь
    # каталог, косая черта — в 24 и чаще всего является частью имени модели
    # ("Transit Connect"), поэтому разбор по ним раздробил бы настоящие имена.
    separators: ["|"]

  - field: applicability_model
    names:
      - "сумісність з моделлю"
      - "совместимость с моделью"
      - "модель"
      - "модель автомобиля"
      - "модель автомобіля"
    separators: ["|"]

  # Ниже — характеристики, которые WP-1 не превращает в отдельные поля, но
  # обязан знать в лицо: иначе они попадут в список нераспознанных и утопят
  # в шуме настоящие переименования продавца. Значения сохраняются в
  # characteristics_raw и будут разобраны в WP-2.
  - field: condition
    names:
      - "стан"
      - "состояние"
    separators: []

  - field: part_kind
    names:
      - "тип запчастини"
      - "тип запчасти"
    separators: []
