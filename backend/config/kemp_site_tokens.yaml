schema_version: metis-kemp-site-tokens-v1
method_version: kemp-site-tokens-v1

# Разбор номеров с карточки товара kemp.ua (WP-1B).
#
# Замер 2026-07-29 (docs/METIS_IDENTITY_KEMPSITE_MEASUREMENT_2026-07-29.md)
# установил главное ограничение: ПОДПИСИ ПОЛЕЙ КАРТОЧКИ НЕДОСТОВЕРНЫ.
# Из 35 найденных настоящих OE 26 лежали в поле «Артикул» и лишь 9 в поле
# «ОЕ номер». Поэтому классификация идёт по форме токена, а поле-источник
# сохраняется только для аудита. Правило, читающее имя поля, запрещено
# (NO_9 мастер-промпта).

# Значение одного поля может содержать несколько номеров.
# Наблюдённые склейки: "713610640/7L0498287", "4017703/04", "55473/MG",
# "LM67048_LM67010", "94727/51804991".
value_separators: [",", ";", "/", "_"]

limits:
  # Ниже четырёх знаков номера не бывает; "04" — обломок склейки, а не номер.
  min_length: 4
  # Тот же потолок, что в catalog_characteristics.yaml.
  max_length: 20

# Внутренний код KEMP. В поле «ОЕ номер» встречается как утечка: замер
# поймал 776414 и 776769. Такой токен не становится oe_norm никогда (NO_5).
# Длина 6-8 знаков; настоящие Renault-номера (7701059269, 7700312011)
# десятизначные и под шаблон не попадают.
internal_code_pattern: "^776[0-9]{3,5}$"

# Формы артикулов поставщиков. Токен такой формы — чужой каталожный номер,
# в oe_norm не идёт. Перечислены поимённо: список пополняется человеком по
# итогам разбора очереди, а не угадывается кодом.
#
# Шаблоны сверяются с СЫРЫМ токеном (после trim и upper), а не с
# нормализованным. Дефисы в "OP-ES-0480" и точка в "6455.EE" — это и есть
# признак формы; normalize_cross_oem их стирает и делает "OPES0480"
# неотличимым от четырёхбуквенного OE. Нормализованный вид используется
# только для сверки тождества: известные номера, дедупликация, внутренний код.
aftermarket_patterns:
  - name: SKF_WHEEL_BEARING_KIT      # VKBA741, VKBA 3901, VKBA6522
    pattern: "^VKBA ?[0-9]+$"
  - name: FAG_WHEEL_BEARING_KIT      # 713610470, 713678890, 713644290
    pattern: "^713[0-9]{6}$"
  # Расширено 2026-07-29 с 53[12] до 53[1-4]: в справочнике заказчика от
  # 29.07 нашлись 533006520, 533007630, 534011620, 534012320 — те же
  # натяжители INA, проходившие как кандидаты в OE. Расширение проверено:
  # новых столкновений с подтверждёнными OE справочника оно не создаёт.
  - name: INA_TENSIONER              # 531039920, 532034910, 534012320
    pattern: "^53[1-4][0-9]{6}$"
  - name: BERU_GLOW_PLUG             # GN948
    pattern: "^GN[0-9]{3,4}$"
  - name: KK_BRAKE_HOSE              # FT0364
    pattern: "^FT[0-9]{4}$"
  - name: MOOG_JOINT                 # OP-ES-0480, VO-AX-7157, CI-BJ-0523
    pattern: "^[A-Z]{2}-[A-Z]{2}-[0-9]{3,5}$"
  - name: SKF_BEARING_DESIGNATION    # LM67048, LM67010
    pattern: "^LM[0-9]{5,6}$"
  - name: BEARING_DAC                # DAC25520037
    pattern: "^DAC[0-9]{8,11}$"

# ЧЕГО ЭТОТ КОНФИГ НЕ УМЕЕТ И НЕ ПРИТВОРЯЕТСЯ, ЧТО УМЕЕТ.
#
# Номера Kayaba (343205, 349080, 333707) неотличимы по форме от настоящих
# шестизначных OE концерна PSA (133389, 133029, 364050). Разделить их может
# только источник, знающий бренд номера. Поэтому такие токены остаются
# OE_CANDIDATE и уходят в очередь разбора.
#
# Это не нарушение fail-closed. Связь из этого источника рождается со
# статусом REVIEW и до решения человека или WP-2 на цену не влияет; ворота
# по-прежнему закрыты. Задача разбора — сократить очередь, а не вынести
# окончательное суждение. Ошибка в сторону OE_CANDIDATE стоит одной строки
# в очереди, ошибка в другую сторону теряет настоящий OE навсегда.
