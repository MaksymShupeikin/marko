x-e2e-backend-environment: &e2e-backend-environment
  ENVIRONMENT: e2e
  DEBUG: "false"
  API_DOCS_ENABLED: "false"
  ALLOWED_HOSTS: api,localhost,127.0.0.1,test,testserver
  CORS_ORIGINS: http://frontend,http://127.0.0.1:${WEB_PORT:-18080}
  FIREBASE_PROJECT_ID: ""
  PROM_MARKETPLACE_SOURCE_ACCESS_VERDICT: NOT_PERMITTED
  PROM_MARKETPLACE_SOURCE_ACCESS_REFERENCE: ""
  PRICING_V3_ROBUST_DISPERSION_ENABLED: "false"
  PRICING_V3_ACTIVATION_ARTIFACT: ""
  PRICING_V3_ACTIVATION_SHA256: ""
  PRICING_COMPARABILITY_V1_AUTOMATIC_ENABLED: "false"
  PRICING_COMPARABILITY_ACTIVATION_ARTIFACT: ""
  PRICING_COMPARABILITY_ACTIVATION_SHA256: ""
  E2E_AUTH_BYPASS: "true"
  E2E_AUTH_TOKEN: ${E2E_AUTH_TOKEN:?synthetic E2E token is required}
  E2E_TASK_HOLD_SECONDS: ${E2E_TASK_HOLD_SECONDS:-8}
  CELERY_VISIBILITY_TIMEOUT_SECONDS: "5"

services:
  db:
    restart: "no"

  broker:
    restart: "no"

  migrate:
    environment: *e2e-backend-environment
    command: ["alembic", "-c", "alembic.ini", "upgrade", "${E2E_MIGRATION_TARGET:-head}"]
    restart: "no"

  api:
    environment: *e2e-backend-environment
    restart: "no"

  worker:
    environment: *e2e-backend-environment
    restart: "no"

  store-sync-worker:
    environment: *e2e-backend-environment
    restart: "no"

  pricing-worker:
    environment: *e2e-backend-environment
    restart: "no"

  scheduler:
    environment: *e2e-backend-environment
    restart: "no"

  frontend:
    build:
      args:
        API_BASE_URL: http://api:8000
        FIREBASE_API_KEY: ""
        FIREBASE_AUTH_DOMAIN: ""
        FIREBASE_PROJECT_ID: ""
        FIREBASE_MESSAGING_SENDER_ID: ""
        FIREBASE_WEB_APP_ID: ""
        E2E_MODE: "true"
        E2E_AUTH_TOKEN: ${E2E_AUTH_TOKEN:?synthetic E2E token is required}
    restart: "no"

  browser-e2e:
    profiles: ["e2e"]
    build:
      context: ./e2e/browser
    environment:
      E2E_FRONTEND_URL: http://frontend
      E2E_EXPECTED_PRODUCT: PROMPT 15.015 E2E brake pad
    volumes:
      - ${E2E_ARTIFACT_DIR:?E2E artifact directory is required}:/artifacts
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: "no"
