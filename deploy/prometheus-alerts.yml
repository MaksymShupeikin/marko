groups:
  - name: marko-availability
    rules:
      - alert: MarkoApiDown
        expr: up{job="marko-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Marko API is unavailable

      - alert: MarkoQueueStalled
        expr: scrape_queue_depth > 0 and scrape_oldest_item_age_seconds > 900
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Marko collection queue is not draining

      - alert: MarkoSchedulerLeaseMissing
        expr: marko_scheduler_lease_present != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Marko scheduler has no live singleton lease

      - alert: MarkoSchedulerLeaseProbeFailed
        expr: marko_scheduler_lease_probe_success != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Marko API cannot inspect the scheduler Redis lease

      - alert: MarkoTerminalFailureRateHigh
        expr: |
          sum(rate(scrape_items_terminal_total{outcome="failed"}[15m]))
          /
          clamp_min(sum(rate(scrape_items_terminal_total[15m])), 0.000001)
          > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 5 percent of scraper items are failing

      - alert: MarkoEvidenceCoverageLow
        expr: scrape_evidence_coverage_ratio < 0.99
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Raw evidence coverage is below the required boundary

      - alert: MarkoRetryAmplificationHigh
        expr: scrape_http_attempts_per_item > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Retry amplification is consuming source capacity

      - alert: MarkoDiscoveryRetrievalEmpty
        expr: |
          marko_discovery_funnel_snapshot_available == 1
          and marko_discovery_candidates_reported_count > 0
          and marko_discovery_candidates_retrieved_count == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Discovery reports available candidates but retrieves none

      - alert: MarkoDiscoveryIdentityCeilingEmpty
        expr: |
          marko_discovery_funnel_snapshot_available == 1
          and marko_discovery_gate_reached_count{gate="oem_identity"} > 0
          and marko_discovery_gate_survival_ceiling_ratio{gate="oem_identity"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No discovery candidate survives the OEM identity gate
