  PRICING_PARSER_SCHEMA_CHANGED_ALERT_COUNT: ${PRICING_PARSER_SCHEMA_CHANGED_ALERT_COUNT:-0}
  PRICING_PARSER_SCHEMA_CHANGED_CRITICAL_RATE: ${PRICING_PARSER_SCHEMA_CHANGED_CRITICAL_RATE:-0.01}
  PRICING_OFFER_INTERNAL_FAILURE_ALERT_COUNT: ${PRICING_OFFER_INTERNAL_FAILURE_ALERT_COUNT:-0}
