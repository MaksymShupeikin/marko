name: marko

# Bounded logs so long-running celery/uvicorn output can't fill the VPS disk.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

# Defaults match local development; the VPS overrides via its .env
# (ENVIRONMENT=production, CORS_ORIGINS=https://…, API_BASE_URL=https://…).
x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marko}:${POSTGRES_PASSWORD:-marko}@db:5432/${POSTGRES_DB:-marko}
  CELERY_BROKER_URL: redis://broker:6379/0
  CELERY_RESULT_BACKEND: redis://broker:6379/1
  COMPETITOR_PRICE_CACHE_URL: redis://broker:6379/2
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-8080}}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-api.markoprice.com,localhost,127.0.0.1,api,testserver}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-31536000}
  RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-true}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
  UPLOAD_MAX_UNCOMPRESSED_BYTES: ${UPLOAD_MAX_UNCOMPRESSED_BYTES:-209715200}
  UPLOAD_MAX_ROWS: ${UPLOAD_MAX_ROWS:-100000}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  COMPETITOR_FILTER_MODEL: ${COMPETITOR_FILTER_MODEL:-gpt-5-nano}
  SERPER_API_KEY: ${SERPER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  FREE_CHECK_LIMIT: ${FREE_CHECK_LIMIT:-30}
  PYTHONDONTWRITEBYTECODE: 1

x-backend: &backend
  build:
    context: ./backend
  environment: *backend-environment
  logging: *default-logging
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - data

services:
  db:
    image: marko-postgres:17-security
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marko}
      POSTGRES_USER: ${POSTGRES_USER:-marko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marko}
    # Loopback only: the containers reach it as db:5432 over the docker
    # network; nothing on a public VPS IP should.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marko} -d ${POSTGRES_DB:-marko}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=0775,uid=70,gid=70
    networks:
      - data

  broker:
    image: marko-redis:8-security
    build:
      context: ./infra/redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - data

  migrate:
    <<: *backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  api:
    <<: *backend
    command:
      [
        "uvicorn",
        "marko.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--no-server-header",
        "--limit-concurrency",
        "100",
        "--timeout-keep-alive",
        "10",
      ]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - data
      - edge

  worker:
    <<: *backend
    command:
      [
        "celery",
        "--app",
        "marko.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777

  scheduler:
    <<: *backend
    command:
      [
        "celery",
        "--app",
        "marko.worker.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      <<: *backend-environment
      FIREBASE_PROJECT_ID: ""
    command: ["pytest", "-q"]

  frontend:
    profiles: ["local", "frontend"]
    build:
      context: ./frontend
      args:
        # Baked into the web bundle at build time — MUST be the public API
        # URL when building for the VPS.
        API_BASE_URL: ${API_BASE_URL:-http://localhost:${API_PORT:-8000}}
        PUBLIC_FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        PUBLIC_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        PUBLIC_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        PUBLIC_FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
        PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - edge

  tunnel:
    image: marko-cloudflared:2026.8.3-scratch
    build:
      context: ./infra/cloudflared
    restart: unless-stopped
    command: tunnel --protocol http2 run --token-file /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - edge

volumes:
  postgres_data:
  redis_data:

secrets:
  cloudflare_tunnel_token:
    environment: CLOUDFLARE_TUNNEL_TOKEN

networks:
  data:
  edge:
