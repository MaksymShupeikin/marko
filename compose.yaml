  PRICING_COLLECTION_WORKER_COUNT: ${PRICING_WORKER_CONCURRENCY:-1}
  PRICING_COLLECTION_MAX_TASK_EXECUTIONS: ${PRICING_COLLECTION_MAX_TASK_EXECUTIONS:-4}
  PRICING_COLLECTION_ITEM_DEADLINE_SECONDS: ${PRICING_COLLECTION_ITEM_DEADLINE_SECONDS:-1800}
  PRICING_COLLECTION_LEASE_SECONDS: ${PRICING_COLLECTION_LEASE_SECONDS:-900}
  PRICING_COLLECTION_TASK_SOFT_TIME_LIMIT_SECONDS: ${PRICING_COLLECTION_TASK_SOFT_TIME_LIMIT_SECONDS:-840}
  PRICING_COLLECTION_TASK_TIME_LIMIT_SECONDS: ${PRICING_COLLECTION_TASK_TIME_LIMIT_SECONDS:-900}
  PRICING_SCRAPER_HTTP_TIMEOUT_SECONDS: ${PRICING_SCRAPER_HTTP_TIMEOUT_SECONDS:-30}
  PRICING_SCRAPER_HTTP_MAX_ATTEMPTS: ${PRICING_SCRAPER_HTTP_MAX_ATTEMPTS:-4}
  PRICING_SCRAPER_REQUEST_DELAY_SECONDS: ${PRICING_SCRAPER_REQUEST_DELAY_SECONDS:-1}
  PRICING_SCRAPER_REQUEST_JITTER_SECONDS: ${PRICING_SCRAPER_REQUEST_JITTER_SECONDS:-0.5}
  PRICING_SCRAPER_MAX_SEARCH_PAGES: ${PRICING_SCRAPER_MAX_SEARCH_PAGES:-10}
  PRICING_SCRAPER_MAX_OE_PAGE_PAGES: ${PRICING_SCRAPER_MAX_OE_PAGE_PAGES:-4}
  PRICING_SCRAPER_MAX_SELLERS: ${PRICING_SCRAPER_MAX_SELLERS:-10}
  PRICING_SCRAPER_MAX_DETAIL_CARDS: ${PRICING_SCRAPER_MAX_DETAIL_CARDS:-0}
  PRICING_SCRAPER_MIN_INDEPENDENT_SELLERS: ${PRICING_SCRAPER_MIN_INDEPENDENT_SELLERS:-3}
  PRICING_DETAIL_REPLAY_MAX_AGE_HOURS: ${PRICING_DETAIL_REPLAY_MAX_AGE_HOURS:-72}
  CATALOG_DISCOVERY_MAX_SEARCH_PAGES: ${CATALOG_DISCOVERY_MAX_SEARCH_PAGES:-10}
  PRICING_BRAND_TIERS_PATH: ${PRICING_BRAND_TIERS_PATH:-/app/config/brands.yaml}
  PRICING_CANDIDATE_SELECTION_PATH: ${PRICING_CANDIDATE_SELECTION_PATH:-/app/config/comparability.yaml}
  PRICING_V3_ROBUST_DISPERSION_ENABLED: ${PRICING_V3_ROBUST_DISPERSION_ENABLED:-false}
  PRICING_V3_ACTIVATION_ARTIFACT: ${PRICING_V3_ACTIVATION_ARTIFACT:-}
  PRICING_V3_ACTIVATION_SHA256: ${PRICING_V3_ACTIVATION_SHA256:-}
  PRICING_COMPARABILITY_V1_AUTOMATIC_ENABLED: ${PRICING_COMPARABILITY_V1_AUTOMATIC_ENABLED:-false}
  PRICING_COMPARABILITY_ACTIVATION_ARTIFACT: ${PRICING_COMPARABILITY_ACTIVATION_ARTIFACT:-}
  PRICING_COMPARABILITY_ACTIVATION_SHA256: ${PRICING_COMPARABILITY_ACTIVATION_SHA256:-}
  PRICING_LLM_COMPARABILITY_MODE: ${PRICING_LLM_COMPARABILITY_MODE:-off}
  PRICING_LLM_PROVIDER: ${PRICING_LLM_PROVIDER:-openai_responses}
  PRICING_LLM_BASE_URL: ${PRICING_LLM_BASE_URL:-https://api.openai.com/v1}
  PRICING_LLM_API_KEY: ${PRICING_LLM_API_KEY:-}
  PRICING_LLM_MODEL: ${PRICING_LLM_MODEL:-gpt-5.6-luna}
  PRICING_LLM_REASONING_EFFORT: ${PRICING_LLM_REASONING_EFFORT:-xhigh}
  PRICING_LLM_IMAGE_DETAIL: ${PRICING_LLM_IMAGE_DETAIL:-auto}
  PRICING_LLM_RATE_VERSION: ${PRICING_LLM_RATE_VERSION:-openai-gpt-5.6-luna-standard-2026-07-30}
  PRICING_LLM_TIMEOUT_SECONDS: ${PRICING_LLM_TIMEOUT_SECONDS:-60}
  PRICING_LLM_MAX_OUTPUT_TOKENS: ${PRICING_LLM_MAX_OUTPUT_TOKENS:-1600}
  PRICING_LLM_MAX_IMAGES: ${PRICING_LLM_MAX_IMAGES:-4}
  PRICING_LLM_MAX_CONCURRENCY: ${PRICING_LLM_MAX_CONCURRENCY:-4}
  PRICING_AI_EVIDENCE_MODE: ${PRICING_AI_EVIDENCE_MODE:-off}
  PRICING_AI_EVIDENCE_API_KEY: ${PRICING_AI_EVIDENCE_API_KEY:-}
  PRICING_AI_EVIDENCE_MODEL: ${PRICING_AI_EVIDENCE_MODEL:-gpt-5.6-luna}
  PRICING_AI_EVIDENCE_REASONING_EFFORT: ${PRICING_AI_EVIDENCE_REASONING_EFFORT:-medium}
  PRICING_AI_EVIDENCE_MAX_OUTPUT_TOKENS: ${PRICING_AI_EVIDENCE_MAX_OUTPUT_TOKENS:-1200}
  PRICING_AI_EVIDENCE_MAX_INPUT_CHARS: ${PRICING_AI_EVIDENCE_MAX_INPUT_CHARS:-20000}
  PRICING_AI_EVIDENCE_MAX_CALLS_PER_POSITION: ${PRICING_AI_EVIDENCE_MAX_CALLS_PER_POSITION:-4}
  PRICING_AI_EVIDENCE_MAX_CANDIDATES_PER_POSITION: ${PRICING_AI_EVIDENCE_MAX_CANDIDATES_PER_POSITION:-4}
  PRICING_AI_EVIDENCE_MAX_CONCURRENCY: ${PRICING_AI_EVIDENCE_MAX_CONCURRENCY:-2}
  PRICING_AI_EVIDENCE_ESCALATION_ENABLED: ${PRICING_AI_EVIDENCE_ESCALATION_ENABLED:-false}
  PRICING_AI_EVIDENCE_ESCALATION_MODEL: ${PRICING_AI_EVIDENCE_ESCALATION_MODEL:-}
  PRICING_AI_EVIDENCE_ESCALATION_REASONING_EFFORT: ${PRICING_AI_EVIDENCE_ESCALATION_REASONING_EFFORT:-}
  OPERATIONAL_METRICS_TOKEN: ${OPERATIONAL_METRICS_TOKEN:-}
  E2E_AUTH_BYPASS: ${E2E_AUTH_BYPASS:-false}
  E2E_AUTH_TOKEN: ${E2E_AUTH_TOKEN:-}
  E2E_TASK_HOLD_SECONDS: ${E2E_TASK_HOLD_SECONDS:-0}
  STORE_SYNC_WORKER_COUNT: ${STORE_SYNC_WORKER_CONCURRENCY:-2}
  STORE_SYNC_MAX_TASK_EXECUTIONS: ${STORE_SYNC_MAX_TASK_EXECUTIONS:-3}
  STORE_SYNC_ITEM_DEADLINE_SECONDS: ${STORE_SYNC_ITEM_DEADLINE_SECONDS:-3600}
  STORE_SYNC_LEASE_SECONDS: ${STORE_SYNC_LEASE_SECONDS:-300}
  STORE_SYNC_TASK_SOFT_TIME_LIMIT_SECONDS: ${STORE_SYNC_TASK_SOFT_TIME_LIMIT_SECONDS:-1740}
  STORE_SYNC_TASK_TIME_LIMIT_SECONDS: ${STORE_SYNC_TASK_TIME_LIMIT_SECONDS:-1800}
  STORE_SYNC_RETRY_BASE_DELAY_SECONDS: ${STORE_SYNC_RETRY_BASE_DELAY_SECONDS:-30}
  STORE_SYNC_SCRAPER_HTTP_TIMEOUT_SECONDS: ${STORE_SYNC_SCRAPER_HTTP_TIMEOUT_SECONDS:-30}
  STORE_SYNC_SCRAPER_HTTP_MAX_ATTEMPTS: ${STORE_SYNC_SCRAPER_HTTP_MAX_ATTEMPTS:-4}
  STORE_SYNC_SCRAPER_PAGES_PER_TASK: ${STORE_SYNC_SCRAPER_PAGES_PER_TASK:-5}
  STORE_SYNC_SCRAPER_TOTAL_PAGE_LIMIT: ${STORE_SYNC_SCRAPER_TOTAL_PAGE_LIMIT:-1000}
  STORE_SYNC_SCRAPER_MAX_PAGES: ${STORE_SYNC_SCRAPER_MAX_PAGES:-0}
  STORE_URL_RESOLVER_TIMEOUT_SECONDS: ${STORE_URL_RESOLVER_TIMEOUT_SECONDS:-10}
  STORE_URL_RESOLVER_MAX_REDIRECTS: ${STORE_URL_RESOLVER_MAX_REDIRECTS:-3}
  STORE_URL_RESOLVER_MAX_RESPONSE_BYTES: ${STORE_URL_RESOLVER_MAX_RESPONSE_BYTES:-2097152}
  SCRAPE_RAW_EVIDENCE_REPLAY_ENABLED: ${SCRAPE_RAW_EVIDENCE_REPLAY_ENABLED:-true}
  SCRAPE_EVIDENCE_GC_BATCH_SIZE: ${SCRAPE_EVIDENCE_GC_BATCH_SIZE:-1000}
  SCRAPE_EVIDENCE_GC_INTERVAL_SECONDS: ${SCRAPE_EVIDENCE_GC_INTERVAL_SECONDS:-3600}
  WORKFLOW_RECONCILE_BATCH_SIZE: ${WORKFLOW_RECONCILE_BATCH_SIZE:-100}
  WORKFLOW_RECONCILE_INTERVAL_SECONDS: ${WORKFLOW_RECONCILE_INTERVAL_SECONDS:-60}
  WORKFLOW_STALE_AFTER_SECONDS: ${WORKFLOW_STALE_AFTER_SECONDS:-3600}
  SCHEDULER_SINGLETON_LOCK_KEY: ${SCHEDULER_SINGLETON_LOCK_KEY:-marko:scheduler:singleton:v1}
  SCHEDULER_SINGLETON_TTL_SECONDS: ${SCHEDULER_SINGLETON_TTL_SECONDS:-90}
  SCHEDULER_SINGLETON_REFRESH_SECONDS: ${SCHEDULER_SINGLETON_REFRESH_SECONDS:-20}
  SCHEDULER_SINGLETON_REACQUIRE_INITIAL_SECONDS: ${SCHEDULER_SINGLETON_REACQUIRE_INITIAL_SECONDS:-1}
  SCHEDULER_SINGLETON_REACQUIRE_MAX_SECONDS: ${SCHEDULER_SINGLETON_REACQUIRE_MAX_SECONDS:-30}
  SCHEDULER_HEALTH_STATE_PATH: /tmp/marko-scheduler-health.json
  PYTHONDONTWRITEBYTECODE: 1

x-backend: &backend
  build:
    context: ./backend
  environment: *backend-environment
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marko}
      POSTGRES_USER: ${POSTGRES_USER:-marko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marko}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marko} -d ${POSTGRES_DB:-marko}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  broker:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command:
      [
        "uvicorn",
        "marko.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${API_WORKERS:-1}",
      ]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command:
      [
        "celery",
        "--app",
        "marko.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=celery,pricing-calculation",
        "--concurrency=${GENERAL_WORKER_CONCURRENCY:-1}",
        "--hostname=general@%h",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app marko.worker.celery_app:celery_app inspect ping --destination general@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 10s
      timeout: 8s
      retries: 12

  store-sync-worker:
    <<: *backend
    command:
      [
        "celery",
        "--app",
        "marko.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=store-sync",
        "--concurrency=${STORE_SYNC_WORKER_CONCURRENCY:-2}",
        "--hostname=store-sync@%h",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app marko.worker.celery_app:celery_app inspect ping --destination store-sync@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 10s
      timeout: 8s
      retries: 12

  pricing-worker:
    <<: *backend
    command:
      [
        "celery",
        "--app",
        "marko.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=pricing",
        "--concurrency=${PRICING_WORKER_CONCURRENCY:-1}",
        "--hostname=pricing@%h",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app marko.worker.celery_app:celery_app inspect ping --destination pricing@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 10s
      timeout: 8s
      retries: 12

  scheduler:
    <<: *backend
    command: ["python", "-m", "marko.worker.beat_singleton"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "marko.worker.beat_singleton", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      <<: *backend-environment
      FIREBASE_PROJECT_ID: ""
    command: ["pytest", "-q"]

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://localhost:${API_PORT:-8000}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
        E2E_MODE: ${E2E_MODE:-false}
        E2E_AUTH_TOKEN: ${E2E_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
