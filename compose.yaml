name: marko

x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marko}:${POSTGRES_PASSWORD:-marko}@db:5432/${POSTGRES_DB:-marko}
  CELERY_BROKER_URL: redis://broker:6379/0
  CELERY_RESULT_BACKEND: redis://broker:6379/1
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,test,testserver}
  CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
  CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
  CORS_METHODS: ${CORS_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
  CORS_HEADERS: ${CORS_HEADERS:-Authorization,Content-Type,Accept,Origin,X-Request-ID}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  PROM_MARKETPLACE_SOURCE_ACCESS_VERDICT: ${PROM_MARKETPLACE_SOURCE_ACCESS_VERDICT:-NOT_PERMITTED}
  PROM_MARKETPLACE_SOURCE_ACCESS_REFERENCE: ${PROM_MARKETPLACE_SOURCE_ACCESS_REFERENCE:-}
  PRICING_COLLECTION_MIN_INTERVAL_SECONDS: ${PRICING_COLLECTION_MIN_INTERVAL_SECONDS:-2}
  PRICING_CIRCUIT_FAILURE_THRESHOLD: ${PRICING_CIRCUIT_FAILURE_THRESHOLD:-5}
  PRICING_CIRCUIT_OPEN_SECONDS: ${PRICING_CIRCUIT_OPEN_SECONDS:-300}
  PRICING_DISPATCH_BATCH_SIZE: ${PRICING_DISPATCH_BATCH_SIZE:-100}
  PRICING_COLLECTION_WORKER_COUNT: ${PRICING_WORKER_CONCURRENCY:-1}
  PRICING_COLLECTION_MAX_TASK_EXECUTIONS: ${PRICING_COLLECTION_MAX_TASK_EXECUTIONS:-4}
  PRICING_COLLECTION_ITEM_DEADLINE_SECONDS: ${PRICING_COLLECTION_ITEM_DEADLINE_SECONDS:-1800}
  PRICING_COLLECTION_LEASE_SECONDS: ${PRICING_COLLECTION_LEASE_SECONDS:-900}
  PRICING_COLLECTION_TASK_SOFT_TIME_LIMIT_SECONDS: ${PRICING_COLLECTION_TASK_SOFT_TIME_LIMIT_SECONDS:-840}
  PRICING_COLLECTION_TASK_TIME_LIMIT_SECONDS: ${PRICING_COLLECTION_TASK_TIME_LIMIT_SECONDS:-900}
  PRICING_SCRAPER_HTTP_TIMEOUT_SECONDS: ${PRICING_SCRAPER_HTTP_TIMEOUT_SECONDS:-30}
  PRICING_SCRAPER_HTTP_MAX_ATTEMPTS: ${PRICING_SCRAPER_HTTP_MAX_ATTEMPTS:-4}
  PRICING_SCRAPER_REQUEST_DELAY_SECONDS: ${PRICING_SCRAPER_REQUEST_DELAY_SECONDS:-1}
  PRICING_SCRAPER_REQUEST_JITTER_SECONDS: ${PRICING_SCRAPER_REQUEST_JITTER_SECONDS:-0.5}
  PRICING_SCRAPER_MAX_SEARCH_PAGES: ${PRICING_SCRAPER_MAX_SEARCH_PAGES:-3}
  PRICING_SCRAPER_MAX_SELLERS: ${PRICING_SCRAPER_MAX_SELLERS:-10}
  PRICING_V3_ROBUST_DISPERSION_ENABLED: ${PRICING_V3_ROBUST_DISPERSION_ENABLED:-false}
  STORE_SYNC_WORKER_COUNT: ${STORE_SYNC_WORKER_CONCURRENCY:-2}
  STORE_SYNC_MAX_TASK_EXECUTIONS: ${STORE_SYNC_MAX_TASK_EXECUTIONS:-3}
  STORE_SYNC_ITEM_DEADLINE_SECONDS: ${STORE_SYNC_ITEM_DEADLINE_SECONDS:-3600}
  STORE_SYNC_LEASE_SECONDS: ${STORE_SYNC_LEASE_SECONDS:-300}
  STORE_SYNC_TASK_SOFT_TIME_LIMIT_SECONDS: ${STORE_SYNC_TASK_SOFT_TIME_LIMIT_SECONDS:-1740}
  STORE_SYNC_TASK_TIME_LIMIT_SECONDS: ${STORE_SYNC_TASK_TIME_LIMIT_SECONDS:-1800}
  STORE_SYNC_RETRY_BASE_DELAY_SECONDS: ${STORE_SYNC_RETRY_BASE_DELAY_SECONDS:-30}
  STORE_SYNC_SCRAPER_HTTP_TIMEOUT_SECONDS: ${STORE_SYNC_SCRAPER_HTTP_TIMEOUT_SECONDS:-30}
  STORE_SYNC_SCRAPER_HTTP_MAX_ATTEMPTS: ${STORE_SYNC_SCRAPER_HTTP_MAX_ATTEMPTS:-4}
  STORE_SYNC_SCRAPER_MAX_PAGES: ${STORE_SYNC_SCRAPER_MAX_PAGES:-0}
  SCRAPE_RAW_EVIDENCE_REPLAY_ENABLED: ${SCRAPE_RAW_EVIDENCE_REPLAY_ENABLED:-true}
  SCRAPE_EVIDENCE_GC_BATCH_SIZE: ${SCRAPE_EVIDENCE_GC_BATCH_SIZE:-1000}
  SCRAPE_EVIDENCE_GC_INTERVAL_SECONDS: ${SCRAPE_EVIDENCE_GC_INTERVAL_SECONDS:-3600}
  PYTHONDONTWRITEBYTECODE: 1

x-backend: &backend
  build:
    context: ./backend
  environment: *backend-environment
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marko}
      POSTGRES_USER: ${POSTGRES_USER:-marko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marko}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marko} -d ${POSTGRES_DB:-marko}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  broker:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command:
      [
        "uvicorn",
        "marko.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${API_WORKERS:-1}",
      ]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command:
      [
        "celery",
        "--app",
        "marko.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=celery,pricing-calculation",
        "--concurrency=${GENERAL_WORKER_CONCURRENCY:-1}",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy

  store-sync-worker:
    <<: *backend
    command:
      [
        "celery",
        "--app",
        "marko.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=store-sync",
        "--concurrency=${STORE_SYNC_WORKER_CONCURRENCY:-2}",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy

  pricing-worker:
    <<: *backend
    command:
      [
        "celery",
        "--app",
        "marko.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=pricing",
        "--concurrency=${PRICING_WORKER_CONCURRENCY:-1}",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy

  scheduler:
    <<: *backend
    command:
      [
        "celery",
        "--app",
        "marko.worker.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      <<: *backend-environment
      FIREBASE_PROJECT_ID: ""
    command: ["pytest", "-q"]

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://localhost:${API_PORT:-8000}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
