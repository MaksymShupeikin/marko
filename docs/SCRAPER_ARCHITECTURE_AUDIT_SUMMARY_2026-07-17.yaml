business_decisions_required:
  - Approve or reject public competitor collection and record an auditable source reference.
  - Define the first logical item kind and average/peak/burst workload envelope.
  - Approve latency, freshness, success, manual-review, and confidence-bound SLOs.
  - Select raw evidence retention, backup, deletion, and legal-hold policy.
  - Select deployment broker/database topology and global per-source request budget.
  - Decide whether Marko is the operator UI for scraper batches and DLQ replay.

source_access_states:
  - source: prom_public_marketplace
    state: NOT_PERMITTED
    live_collection_allowed: false
    technical_effect: New live fetch stops before network execution; retained evidence replay remains allowed.
  - source: retained_raw_replay
    state: PERMITTED_OFFLINE
    live_collection_allowed: false
    technical_effect: Parser/storage/queue validation can proceed without new source requests.

engineering_assumptions:
  - id: ASSUMPTION-RHO-HEADROOM
    statement: rho_system<=0.70 is the initial headroom target.
    status: UNAPPROVED
  - id: ASSUMPTION-OUTBOX-LEASE
    statement: A 60-second outbox dispatch lease is adequate for broker publish.
    status: REQUIRES_ENVIRONMENT_VALIDATION
  - id: ASSUMPTION-RAW-INLINE-STORAGE
    statement: PostgreSQL compressed blobs remain acceptable until measured storage throughput requires object storage.
    status: REQUIRES_LOAD_EVIDENCE

future_hypotheses:
  - id: HYPOTHESIS-OBJECT-STORE
    proposal: Move immutable raw bodies to content-addressed object storage while retaining transactional metadata.
    expected_gain: Lower database bloat and independent retention tiers.
    required_evidence: Measured database write/storage bottleneck.
    first_validation_step: Compare PostgreSQL and object-store replay fixtures under L3 load.
    not_current_fact: true

